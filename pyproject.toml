[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevtrade"
version = "0.1.0"
description = "Paper-trading research system using Jev probabilities and a deterministic policy layer"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
