# Default configuration. Secrets do NOT belong here — use environment
# variables (see .env.example).

data:
  exchange: coinbaseexchange # api.exchange.coinbase.com; or kraken (latest 720 candles only)
  # Every coin Robinhood lists as tradable that also has an active Coinbase
  # USD market, stablecoins and PAXG (gold) left out. symbols_live re-reads
  # both lists at the start of every collect run and dashboard start, so new
  # listings join and delistings drop on their own; the list below is the
  # fallback when either site can't be reached, and sets the order (oldest
  # listings first, so a pass that runs out of time has done the majors).
  # The hourly collect workflow asks Jev once per coin per closed candle:
  # about $0.00008 per call, so 81 coins x 24 calls = ~$0.16 per day.
  symbols_live: true
  exclude: [PAXG/USD]
  symbols: [
    BTC/USD, ETH/USD, BCH/USD, DOGE/USD, ETC/USD, LTC/USD, XRP/USD, ZEC/USD,
    XLM/USD, BNB/USD, ADA/USD, SOL/USD, AVAX/USD, DOT/USD, SHIB/USD, ATOM/USD,
    NEAR/USD, COMP/USD, LINK/USD, UNI/USD, ALGO/USD, HBAR/USD, BAT/USD,
    ZRX/USD, CRV/USD, GRT/USD, AAVE/USD, XTZ/USD, AXS/USD, PEPE/USD, ZRO/USD,
    RENDER/USD, WIF/USD, ARB/USD, OP/USD, BONK/USD, TRUMP/USD, ONDO/USD,
    FET/USD, ENA/USD, VIRTUAL/USD, RAY/USD, IMX/USD, WLD/USD, INJ/USD, LDO/USD,
    QNT/USD, PENGU/USD, FLOKI/USD, PYTH/USD, STRK/USD, AERO/USD, JTO/USD,
    MORPHO/USD, EIGEN/USD, W/USD, SNX/USD, POPCAT/USD, BIO/USD, PNUT/USD,
    ORCA/USD, VVV/USD, MOODENG/USD, SUI/USD, SKY/USD, XCN/USD, WLFI/USD,
    ZORA/USD, SEI/USD, ASTER/USD, XPL/USD, HYPE/USD, AVNT/USD, SYRUP/USD,
    SKR/USD, MEGA/USD, SENT/USD, CHIP/USD, FLR/USD, RE/USD, BILL/USD,
  ]
  timeframe: 1h
  start: "2025-01-01T00:00:00Z" # backfilled on coinbase; kraken can't reach it
  page_limit: 300            # clamped per exchange: coinbase 300, kraken 720
  requests_trust_env: true   # use HTTPS_PROXY / REQUESTS_CA_BUNDLE from the environment

storage:
  sqlite_path: data/jevtrade.sqlite

features:
  return_windows: [1, 4, 24, 72]
  vol_windows: [24, 72]
  volume_z_window: 24
  rsi_period: 14
  ma_windows: [20, 50, 200]

state:
  history_bars: 24
  percentile_window: 720
  target_max_tokens: 2000

decision:
  model: mock                # mock | baseline | jev
  # Jev is asked about the next 24 hours and a 3% band: a Robinhood round trip
  # costs ~2%, so "up" means a move that still pays after costs. Over 180 days
  # of these coins a 4-hour, 1% "up" averaged only +2.5%.
  horizon_bars: 24           # direction horizon: 24 bars = 24 hours on 1h candles
  flat_band_pct: 3.0         # "up" > +3%, "down" < -3%, otherwise "flat"
  adverse_move_pct: 8.0      # matches policy.stop_loss_pct; see docs/jev_prompt.md
  mock_abstain_rate: 0.1
  baseline_fast: 20
  baseline_slow: 50
  jev:                       # key comes from $OPENROUTER_API_KEY, never from YAML
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    model: typesafe/jev-1.13-20260917   # pinned snapshot; aliases are rejected
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 30
    max_retries: 2
    price_per_input_token_usd: 0.000000042   # $0.042 / Mtok input, output free

policy:                      # all risk limits live here, enforced in code
  entry_threshold: 0.60      # min p(up) to open a long
  min_edge: 0.40             # min p(up) - p(down)
  exit_threshold: 0.40       # p(down) that closes a long...
  exit_min_edge: 0.30        # ...when p(down) - p(up) is also at least this
  # Sizing is risk-based: notional = equity x risk_per_trade / stop distance,
  # capped at max_position_frac. With an 8% stop that is 12.5% of equity per
  # position, so up to 4 coins fit under max_gross_exposure.
  risk_per_trade: 0.01       # equity at risk if the stop is hit
  # 8%: with no time exit a position is held for days, and over the last 180
  # days these coins dipped 3% within 3 days 62% of the time (8%: 21%).
  stop_loss_pct: 0.08
  stop_slippage_bps: 5       # stops trigger on the bar low; fill at stop (or gap open) less this
  max_position_frac: 0.50    # per-symbol notional / equity
  max_gross_exposure: 0.50
  min_trade_frac: 0.01
  max_daily_loss_pct: 0.03   # blocks new entries for the rest of the UTC day
  cooldown_after_losses: 3
  cooldown_bars: 24
  min_trade_interval_bars: 0 # bars after an exit before the same symbol can re-enter (0 = right away)
  # max_holding_bars defaults to decision.horizon_bars (24); set it here to override.
  max_holding_bars_by_model: # per decision model; null = no time exit
    baseline: null           # exits when the SMA crosses back (or on the stop)
    jev: null                # holds until p(down) >= exit_threshold or the stop

backtest:                    # python -m jevtrade.backtest
  initial_equity: 10000
  fee_bps: 10                # per side, on notional
  slippage_bps: 2            # entries and non-stop exits fill at the next open, moved this much against us
  start: null                # first decision bar (ISO-8601 UTC); null = all stored data after warm-up
  end: null
  output_dir: data/backtests
  log_decisions: true        # decisions table, under the run id
  log_inputs: false          # also store each state text (~2KB per decision)

paper:                       # python -m jevtrade.paper run   (simulated fills only, never real orders)
  run_id: paper              # change it to start a fresh paper account; old rows are kept
  initial_equity: 10000
  fee_bps: 10                # same cost model as the backtest
  slippage_bps: 2
  poll_delay_s: 30           # after a candle closes, wait this long for the exchange to publish it
  retry_s: 60                # after a failed step (network error), retry this soon
  max_catchup_bars: 48       # after downtime, older missed bars run risk-only (stops, no new entries)
  stall_grace_bars: 1        # wait at most this many bars for a held coin's late candle; flat coins never wait
  log_inputs: true           # keep each state text with its decision
  daily_report: true         # write the report for each UTC day as its last bar is processed
  lock_path: null            # default: <sqlite_path>.paper.lock

jev_paper:                   # the dashboard's Jev portfolio, replayed from the forward log
  initial_equity: 10000
  # Robinhood-like costs. Robinhood charges no commission on crypto; you pay
  # its quote spread. The replay uses the bid and ask the collect run logged
  # from Robinhood each hour; spread_bps and thin_extra_bps below are only the
  # fallback for a coin with no quote logged yet. They match Robinhood's quotes
  # on 2026-10-05 (about 0.95% either side of the mid on BTC and ETH, up to
  # about 1.15% on the thinnest coins, so a round trip costs ~1.9-2.3%).
  # For an exchange with fees instead: fee_bps = its taker fee, spread_bps ~ 1-5.
  fee_bps: 0                 # per side, on notional
  slippage_bps: 0            # beyond the quoted spread
  spread_bps: 95             # fallback: per side from the mid, deep markets (BTC, ETH)
  thin_extra_bps: 20         # added for thin coins: in full at 100x below ref_volume_usd (log scale)
  ref_volume_usd: 5000000    # hourly Coinbase dollar volume (median of the last 24 logged hours)
  volume_bars: 24
  max_volume_frac: 0.01      # a buy is at most 1% of that hourly dollar volume; null = no cap
  # Skill gate: buy only while Jev's buy signals of the last 7 days (every answer
  # that met the buy thresholds) returned more than their round-trip cost and
  # more than the average coin over the next 24 hours. Until 500 of them have
  # resolved, nothing is bought: about 2.5 days after a fresh start at 15
  # signals an hour, 4.5 days at 6 (24 hours to resolve, then 500 / rate). The
  # 144 resolved hours a 7-day window holds reach 500 only while Jev averages
  # 3.5 signals an hour or more. null = no gate.
  gate_lookback_hours: 168
  gate_min_signals: 500

report:                      # python -m jevtrade.report [--day YYYY-MM-DD]
  output_dir: reports/out    # <output_dir>/<run id>/<day>.md and .json (git-ignored)
  buckets: 5                 # reliability buckets for p(up)

api:                         # python -m jevtrade.api   (GET only, database opened read-only)
  host: 127.0.0.1            # 0.0.0.0 inside docker; keep it off the public internet
  port: 8000
  cors_origins: ["http://localhost:5173"]   # the dashboard's dev server

forward_log:                 # the dashboard's "Jev forward log": the collect workflow's data-log branch
  source: github             # github | local | off
  repo: JaeHyun-Cha-00/jev_crypto_trading
  branch: data-log
  local_dir: data-log        # for source: local (e.g. `git worktree add data-log origin/data-log`)
  refresh_seconds: 300       # re-read at most this often; on failure the last good data is kept
  max_days: 30               # newest day files to load
  token_env: GITHUB_TOKEN    # optional token for a private repo or higher GitHub rate limits
  # Fresh start (candle open, UTC). The collect workflow never asks Jev about an
  # earlier candle (its backfill stops here), and the dashboard ignores earlier
  # lines, so the portfolio starts at its full balance from this hour. null: no cutoff.
  # 2026-10-05T17:00Z: restarted when the direction question moved from 4 hours
  # and 1% to 24 hours and 3%; earlier lines answered the old question.
  start: "2026-10-05T17:00:00Z"

market:                      # the dashboard's live coin list and coin pages: public Coinbase data, no keys
  enabled: true
  base_url: https://api.exchange.coinbase.com
  stats_seconds: 5           # 24-hour price, change and volume for every coin, one call
  spark_seconds: 300         # 24-hour sparklines, one call per coin in the background
  book_seconds: 2            # order book and recent trades cache
