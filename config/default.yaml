# Default configuration. Secrets do NOT belong here — use environment
# variables (see .env.example).

data:
  exchange: coinbaseexchange # api.exchange.coinbase.com, the only exchange supported
  # The coins Jev trades every hour and the dashboard lists, all with a
  # Coinbase USD market (no stablecoins or PAXG). Fixed so Jev is measured on
  # the same coins every day: edit this list to add or drop one. A coin
  # Coinbase stops serving is skipped for that run. Oldest listings first, so a
  # pass that runs out of time has done the majors. Each Jev call costs about
  # $0.00008, so 82 coins x 24 calls = ~$0.16 per day.
  symbols: [
    BTC/USD, ETH/USD, BCH/USD, DOGE/USD, ETC/USD, LTC/USD, XRP/USD, ZEC/USD,
    XLM/USD, BNB/USD, ADA/USD, SOL/USD, AVAX/USD, DOT/USD, SHIB/USD, ATOM/USD,
    NEAR/USD, COMP/USD, LINK/USD, UNI/USD, ALGO/USD, HBAR/USD, BAT/USD,
    ZRX/USD, CRV/USD, GRT/USD, AAVE/USD, XTZ/USD, AXS/USD, PEPE/USD, ZRO/USD,
    RENDER/USD, WIF/USD, ARB/USD, OP/USD, BONK/USD, TRUMP/USD, ONDO/USD,
    FET/USD, ENA/USD, VIRTUAL/USD, RAY/USD, IMX/USD, WLD/USD, INJ/USD, LDO/USD,
    QNT/USD, PENGU/USD, FLOKI/USD, PYTH/USD, STRK/USD, AERO/USD, JTO/USD,
    MORPHO/USD, EIGEN/USD, W/USD, SNX/USD, POPCAT/USD, BIO/USD, PNUT/USD,
    ORCA/USD, VVV/USD, MOODENG/USD, SUI/USD, SKY/USD, XCN/USD, WLFI/USD,
    ZORA/USD, SEI/USD, ASTER/USD, XPL/USD, HYPE/USD, AVNT/USD, SYRUP/USD,
    SKR/USD, MEGA/USD, SENT/USD, CHIP/USD, FLR/USD, RE/USD, BILL/USD, MON/USD,
  ]
  timeframe: 1h
  page_limit: 300            # candles per request; Coinbase serves at most 300
  requests_trust_env: true   # use HTTPS_PROXY / REQUESTS_CA_BUNDLE from the environment

features:
  return_windows: [1, 4, 24, 72]
  vol_windows: [24, 72]
  volume_z_window: 24
  rsi_period: 14
  ma_windows: [20, 50, 200]

state:
  history_bars: 24
  percentile_window: 720
  target_max_tokens: 2000

decision:
  # Jev trades with a fixed prompt (src/jevtrade/decision/agent.py, shown in
  # docs/jev_prompt.md): each hour it chooses buy_small / buy_normal / buy_large /
  # wait for a coin the account doesn't hold, and hold / sell for one it does.
  # The settings below only score those choices afterwards (the collector's
  # outcomes): the close 24 hours later, labelled up / flat / down at 3%.
  horizon_bars: 24
  flat_band_pct: 3.0
  adverse_move_pct: 8.0
  jev:                       # key comes from $OPENROUTER_API_KEY, never from YAML
    base_url: https://openrouter.ai/api/v1
    model: typesafe/jev-1.13-20260917   # pinned snapshot; aliases are rejected
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 30
    max_retries: 2
    price_per_input_token_usd: 0.000000042   # $0.042 / Mtok input, output free

jev_paper:                   # Jev's paper account (src/jevtrade/forward/agent.py)
  initial_equity: 10000
  # The share of equity each buy size spends. Jev picks the size; a buy is cut
  # to the cash left. No stop-loss, time limit or position cap: a position
  # stays open until Jev sells it.
  sizes: {small: 0.05, normal: 0.10, large: 0.20}
  # Coinbase Advanced costs: a taker fee on every fill plus half the order-book
  # spread. 0.60% is the taker fee at the lowest volume tier (under $10k a
  # month; it falls with volume). The spread is tight on deep markets (BTC,
  # ETH) and wider on thin coins. A round trip costs ~1.2-1.8%; Jev's mandate
  # quotes the fee plus a mid-depth spread (0.8% a side, 1.5% a round trip).
  fee_bps: 60                # per side, on notional
  slippage_bps: 0            # beyond the spread
  spread_bps: 2              # per side from the mid, deep markets (BTC, ETH)
  thin_extra_bps: 30         # added for thin coins: in full at 100x below ref_volume_usd (log scale)
  ref_volume_usd: 5000000    # hourly Coinbase dollar volume (median of the last 24 logged hours)
  volume_bars: 24

api:                         # python -m jevtrade.api   (GET only)
  host: 127.0.0.1            # 0.0.0.0 inside docker; keep it off the public internet
  port: 8000
  cors_origins: ["http://localhost:5173"]   # the dashboard's dev server

forward_log:                 # the dashboard's "Jev forward log": the collect workflow's data-log branch
  source: github             # github | local | off
  repo: JaeHyun-Cha-00/jev_crypto_trading
  branch: data-log
  local_dir: data-log        # for source: local (e.g. `git worktree add data-log origin/data-log`)
  refresh_seconds: 300       # re-read at most this often; on failure the last good data is kept
  max_days: 400              # newest day files to load; the account replays from `start`, so reach back that far
  token_env: GITHUB_TOKEN    # optional token for a private repo or higher GitHub rate limits
  # Fresh start (candle open, UTC): the account opens with initial_equity in
  # cash at this candle. The collect workflow never asks Jev about an earlier
  # candle, and the dashboard ignores earlier lines. Earlier lines stay on data-log.
  # 2026-10-14T23:00Z (16:00 PDT) is the first candle of version 2, the agent
  # prompt (agent-1): its first decision is just after 00:00Z.
  # (Earlier starts, with the old direction questions and rule-based policy:
  # 2026-10-06T18:00Z, 2026-10-06T17:00Z, 2026-10-05T17:00Z.)
  start: "2026-10-14T23:00:00Z"

market:                      # the dashboard's live coin list and coin pages: public Coinbase data, no keys
  enabled: true
  base_url: https://api.exchange.coinbase.com
  stats_seconds: 5           # 24-hour price, change and volume for every coin, one call
  spark_seconds: 300         # 24-hour sparklines, one call per coin in the background
  book_seconds: 2            # order book and recent trades cache
