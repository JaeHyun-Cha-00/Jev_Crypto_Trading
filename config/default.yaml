# Default configuration. Secrets do NOT belong here — use environment
# variables (see .env.example).

data:
  exchange: kraken           # any ccxt exchange id with public OHLCV
  symbols: [BTC/USDT, ETH/USDT]
  timeframe: 1h
  start: "2024-01-01T00:00:00Z"
  page_limit: 720            # kraken returns at most the latest 720 candles

storage:
  sqlite_path: data/jevtrade.sqlite
