# One command runs the read-only API and the dashboard:
#
#   docker compose up -d --build
#
# Dashboard: http://localhost:8080 (bound to localhost only; see README for
# reaching it from your laptop over SSH). The dashboard shows Jev's hourly
# forward log, which the collect workflow writes to the data-log branch; the
# API reads it from GitHub. Nothing here trades, calls Jev or places orders.

services:
  api:
    build: .
    image: jevtrade:latest
    restart: unless-stopped
    env_file:
      - path: .env          # GITHUB_TOKEN, only if the repo (and its forward log) is private
        required: false
    volumes:
      - ./config:/app/config:ro   # edit config/default.yaml, then `docker compose restart api`
    # Reads the forward log from GitHub over HTTPS (forward_log in config/default.yaml)
    # and public Coinbase prices for the Market view (market:); the default bridge
    # network allows that outbound. Nothing else leaves the box; no keys, no orders.
    command: ["python", "-m", "jevtrade.api", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backstop for GitHub's hourly schedule, which can skip runs: at :20 it starts
  # the collect workflow if no run started this hour. Needs GITHUB_TOKEN with
  # "Actions: read and write"; without one it exits and stays stopped.
  collect-kick:
    image: jevtrade:latest
    pull_policy: never          # built by the api service
    restart: on-failure:3
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config:/app/config:ro
    command: ["python", "-m", "jevtrade.collect.kick"]
    depends_on: [api]

  web:
    build: ./web
    image: jevtrade-web:latest
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:8080:80"     # change to "8080:80" only behind a firewall or VPN; there is no login
