name: docker

# Split from tests.yml so the image builds run only when a file they depend on
# changes (see the minutes note there).
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - "pyproject.toml"
      - "web/package*.json"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - "pyproject.toml"
      - "web/package*.json"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image Render runs (render.yaml)
        run: docker build -t jevtrade .
