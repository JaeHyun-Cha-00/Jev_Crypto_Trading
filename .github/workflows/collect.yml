name: collect

# Hourly forward collection: Jev answers for every closed 1h candle of each
# coin in config/default.yaml (data.symbols), plus realized outcomes,
# committed to the `data-log` branch.
# No trading and no simulated positions. Every Jev call costs money.

on:
  schedule:
    - cron: "7 * * * *"   # a few minutes after the hour, once Coinbase has the candle
  workflow_dispatch:

permissions:
  contents: write

# Never run two passes at once: both would ask Jev about the same candles.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # the first pass after adding coins backfills 24 candles each
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Check out data-log
        id: datalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin +refs/heads/data-log:refs/remotes/origin/data-log; then
            git worktree add -B data-log data-log-tree origin/data-log
          else
            # First run: an orphan branch with no code, so main stays clean.
            git worktree add --orphan -b data-log data-log-tree
          fi

      - name: Collect
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m jevtrade.collect --out data-log-tree --max-backfill 24 --require-key

      # Runs even if Collect failed midway, so answers already paid for are kept.
      - name: Commit and push
        if: always() && steps.datalog.outcome == 'success'
        working-directory: data-log-tree
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -q -m "collect: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git push origin HEAD:data-log && exit 0
            sleep $((i * 5))
            git pull --rebase -q origin data-log || true
          done
          exit 1
